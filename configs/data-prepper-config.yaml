entry-pipeline:
  source:
    otel_trace_source:
      ssl: false
  sink:
    - pipeline:
        name: "raw-pipeline"
    - pipeline:
        name: "service-map-pipeline"
raw-pipeline:
  source:
    pipeline:
      name: "entry-pipeline"
  processor:
    - otel_traces:
  sink:
    - opensearch:
        hosts: [ "http://opensearch:9200" ]
        index_type: trace-analytics-raw
service-map-pipeline:
  source:
    pipeline:
      name: "entry-pipeline"
  processor:
    - service_map:
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index_type: trace-analytics-service-map

metrics-pipeline:
  source:
    otel_metrics_source:
      ssl: false
  processor:
    - otel_metrics:
  sink:
    - opensearch:
        hosts: [ "http://opensearch:9200" ]
        insecure: true
        index: metrics-otel-v1-%{yyyy.MM.dd}

otel-logs-pipeline:
  source:
    otel_logs_source:
      ssl: false
    processor:
    - otel_logs_raw_processor:
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index: ss4o_logs-%{yyyy.MM.dd}
        insecure: true
